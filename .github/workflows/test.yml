name: Run Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        stability: [stable, lowest]
        exclude:
          - php: '8.2'
            laravel: '13'
        # Tilde constraints: cmd.exe strips '^' from composer arguments on Windows runners.
        include:
          - laravel: '12'
            testbench: '~10.12'
          - laravel: '13'
            testbench: '~11.3'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.stability }} / ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, mbstring, zip, pdo_sqlite, fileinfo
          coverage: none
      - run: composer require "laravel/framework:~${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
      - run: composer update --prefer-${{ matrix.stability }} --prefer-dist --no-interaction --no-progress
      - run: php vendor/bin/phpunit --colors=always
      - run: composer audit --no-interaction
